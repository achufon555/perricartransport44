<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#accent)" opacity="0.06"/>

  <!-- ramp -->
  <path d="M40 340 L300 260 L560 340 Z" fill="#151515"/>
  <path d="M40 340 L300 260 L300 275 L60 345 Z" fill="url(#accent)" opacity="0.5"/>

  <!-- car being loaded -->
  <g transform="translate(150,215)">
    <rect x="0" y="30" width="180" height="40" rx="14" fill="url(#accent)"/>
    <path d="M20 30 Q40 0 90 0 Q140 0 160 30 Z" fill="url(#accent)" opacity="0.85"/>
    <circle cx="35" cy="72" r="16" fill="#0a0a0a" stroke="#fff" stroke-width="3" opacity="0.9"/>
    <circle cx="145" cy="72" r="16" fill="#0a0a0a" stroke="#fff" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- worker silhouette -->
  <g transform="translate(400,255)" fill="#f5f5f5" opacity="0.92">
    <circle cx="20" cy="0" r="14"/>
    <path d="M0 20 Q20 10 40 20 L36 80 Q20 90 4 80 Z"/>
    <rect x="-6" y="78" width="14" height="45" rx="6"/>
    <rect x="32" y="78" width="14" height="45" rx="6"/>
  </g>

  <!-- carrier deck -->
  <rect x="0" y="345" width="600" height="16" fill="#111"/>
  <g stroke="#f97316" stroke-width="4" opacity="0.5">
    <line x1="0" y1="353" x2="600" y2="353"/>
  </g>

  <!-- floating brand glow -->
  <circle cx="500" cy="90" r="120" fill="url(#accent)" opacity="0.08"/>
</svg>
