<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="700" height="450" fill="#0f0f0f"/>
  <rect x="0" y="330" width="700" height="6" fill="#f97316" opacity="0.4"/>

  <!-- enclosed trailer -->
  <g transform="translate(60,140)">
    <rect x="0" y="-20" width="500" height="150" rx="14" fill="#161616" stroke="url(#accent)" stroke-width="4"/>
    <rect x="20" y="0" width="460" height="45" rx="6" fill="url(#accent)" opacity="0.25"/>
    <rect x="20" y="60" width="460" height="45" rx="6" fill="url(#accent)" opacity="0.15"/>
    <text x="250" y="65" fill="#f97316" font-family="sans-serif" font-size="26" font-weight="800" text-anchor="middle" opacity="0.85">SECURE</text>

    <!-- cab -->
    <rect x="-90" y="-10" width="90" height="140" rx="10" fill="#dc2626"/>
    <rect x="-76" y="6" width="60" height="38" rx="4" fill="#1a0a06"/>

    <!-- wheels -->
    <g fill="#0a0a0a" stroke="#f97316" stroke-width="6">
      <circle cx="-50" cy="140" r="26"/>
      <circle cx="90" cy="140" r="26"/>
      <circle cx="260" cy="140" r="26"/>
      <circle cx="430" cy="140" r="26"/>
    </g>
  </g>
</svg>
