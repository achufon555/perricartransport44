<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a05"/>
      <stop offset="55%" stop-color="#2a0f08"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="520" r="420" fill="url(#sun)"/>

  <!-- distant hills -->
  <path d="M0 560 Q200 500 420 545 T900 530 T1600 555 L1600 620 L0 620 Z" fill="#140705" opacity="0.8"/>

  <!-- road -->
  <path d="M0 900 L560 560 L1040 560 L1600 900 Z" fill="url(#road)"/>
  <path d="M760 560 L840 560 L1160 900 L440 900 Z" fill="#111"/>
  <g stroke="#f97316" stroke-width="10" stroke-dasharray="40 34" opacity="0.85">
    <path d="M800 580 L800 900" />
  </g>

  <!-- car carrier truck silhouette -->
  <g transform="translate(430,430)">
    <rect x="0" y="70" width="560" height="120" rx="10" fill="#111"/>
    <rect x="10" y="80" width="540" height="45" rx="6" fill="url(#truckBody)" opacity="0.85"/>
    <rect x="10" y="132" width="540" height="45" rx="6" fill="url(#truckBody)" opacity="0.55"/>
    <rect x="440" y="10" width="120" height="90" rx="8" fill="#dc2626"/>
    <rect x="452" y="24" width="55" height="35" rx="4" fill="#2a0a06"/>
    <circle cx="80" cy="200" r="34" fill="#0a0a0a" stroke="#f97316" stroke-width="6"/>
    <circle cx="220" cy="200" r="34" fill="#0a0a0a" stroke="#f97316" stroke-width="6"/>
    <circle cx="480" cy="200" r="34" fill="#0a0a0a" stroke="#f97316" stroke-width="6"/>
    <rect x="0" y="60" width="560" height="8" fill="#f97316" opacity="0.6"/>
  </g>

  <rect width="1600" height="900" fill="#000" opacity="0.15"/>
</svg>
