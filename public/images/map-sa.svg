<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="700" height="620" fill="#0a0a0a"/>

  <!-- simplified South Africa outline -->
  <path d="M120 120 L300 90 L460 120 L560 180 L600 260 L580 340 L610 400 L560 470 L500 520 L420 560 L320 570 L240 540 L180 480 L140 420 L100 360 L90 280 L70 200 Z"
        fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.55"/>
  <path d="M120 120 L300 90 L460 120 L560 180 L600 260 L580 340 L610 400 L560 470 L500 520 L420 560 L320 570 L240 540 L180 480 L140 420 L100 360 L90 280 L70 200 Z"
        fill="url(#accent)" opacity="0.05"/>

  <!-- route lines -->
  <g stroke="#f97316" stroke-width="3" stroke-dasharray="10 8" opacity="0.7" fill="none">
    <path d="M330 200 L520 220"/>
    <path d="M520 220 L470 450"/>
    <path d="M330 200 L470 450"/>
  </g>

  <!-- city markers: Johannesburg, Durban, Cape Town -->
  <g>
    <circle cx="330" cy="200" r="10" fill="url(#accent)"/>
    <circle cx="330" cy="200" r="18" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
    <text x="345" y="196" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="700">Johannesburg</text>

    <circle cx="520" cy="220" r="10" fill="url(#accent)"/>
    <circle cx="520" cy="220" r="18" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
    <text x="535" y="216" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="700">Durban</text>

    <circle cx="470" cy="450" r="10" fill="url(#accent)"/>
    <circle cx="470" cy="450" r="18" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
    <text x="360" y="460" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="700">Cape Town</text>
  </g>
</svg>
