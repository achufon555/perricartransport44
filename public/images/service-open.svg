<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="700" height="450" fill="#0f0f0f"/>
  <rect x="0" y="330" width="700" height="6" fill="#f97316" opacity="0.4"/>

  <!-- open two-level carrier -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="560" height="16" fill="#1c1c1c"/>
    <rect x="0" y="90" width="560" height="16" fill="#1c1c1c"/>

    <!-- top cars -->
    <g fill="url(#accent)" opacity="0.9">
      <rect x="30" y="-38" width="130" height="42" rx="12"/>
      <rect x="200" y="-38" width="130" height="42" rx="12"/>
      <rect x="370" y="-38" width="130" height="42" rx="12"/>
    </g>
    <!-- bottom cars -->
    <g fill="url(#accent)" opacity="0.6">
      <rect x="60" y="52" width="130" height="38" rx="12"/>
      <rect x="260" y="52" width="130" height="38" rx="12"/>
    </g>

    <!-- cab -->
    <rect x="-70" y="10" width="70" height="96" rx="8" fill="#dc2626"/>
    <rect x="-58" y="24" width="46" height="30" rx="4" fill="#1a0a06"/>

    <!-- wheels -->
    <g fill="#0a0a0a" stroke="#f97316" stroke-width="6">
      <circle cx="-40" cy="118" r="24"/>
      <circle cx="90" cy="118" r="24"/>
      <circle cx="260" cy="118" r="24"/>
      <circle cx="420" cy="118" r="24"/>
      <circle cx="530" cy="118" r="24"/>
    </g>
  </g>
</svg>
